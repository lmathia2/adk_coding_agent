schema_version: 1

app:
  name: pi_inspired_adk_coding_agent

harness:
  implementation: pi_coding_v1
  api_version: 1
  required_capabilities:
    - streaming
    - steering
    - tool_events
    - state_snapshots
    - artifacts
  config:
    models:
      coding:
        provider: google_adk
        name: gemini-3.7-flash
        retry:
          attempts: 3
          exponential_base: 2
          initial_delay_seconds: 1
          retry_statuses: [429, 500, 502, 503, 504]
      reviewer:
        provider: google_adk
        name: gemini-3.7-flash

    agents:
      coding_worker:
        kind: llm
        model: coding
        prompt:
          source: builtin
          name: coding_worker_v1
        tools: [read, bash, edit, write]
        output_schema: agent_step
        mode: multi_turn
      final_diff_reviewer:
        kind: reviewer
        model: reviewer
        prompt:
          source: builtin
          name: final_diff_review_v1
        tools: []
        output_schema: final_diff_review
        mode: single_turn

    workflow:
      entry: initialize
      max_iterations: 40
      nodes:
        initialize:
          kind: initialize
          next: compile
        compile:
          kind: compile_context
          next: code
        code:
          kind: invoke_agent
          agent: coding_worker
          next: reduce
        reduce:
          kind: reduce_step
          next: route
        route:
          kind: route
          routes:
            continue: compile
            compact: compact
            replan: replan
            verify: verify
            blocked: blocked
        compact:
          kind: compact
          next: compile
        replan:
          kind: replan
          next: compile
        verify:
          kind: verify
          routes:
            passed: review
            failed: compile
        review:
          kind: review
          agent: final_diff_reviewer
          enabled: false
          next: finish
        finish:
          kind: finish
        blocked:
          kind: blocked

    tools:
      visible: [read, bash, edit, write]
      read_default_lines: 400
      bash_default_timeout_seconds: 120
      bash_max_timeout_seconds: 600
      output:
        max_bytes: 16000
      search:
        backend: auto
        default_page_size: 20
        max_page_size: 50

    context:
      compact_at_tokens: 80000
      recent_event_limit: 12
      repository_map_tokens: 1200
      skill_context_bytes: 24000
      max_selected_skills: 3

    safety:
      allow_dependency_install: false
      allow_network: false
      allow_git_history_mutation: false
      allow_unknown_commands: false
      destructive_commands: deny
      publishing_commands: approval_required
      redact_environment_names: []

    sandbox:
      kind: local
      memory_bytes: 4294967296
      max_processes: 256
      max_file_bytes: 1073741824

    steering:
      enabled: true
      lease_seconds: 900
      batch_limit: 4
      max_message_bytes: 4096
      safe_points: [before_model, before_tool, work_batch_boundary]

    adk:
      context_cache:
        min_tokens: 4096
        ttl_seconds: 1800
        cache_intervals: 10
      event_compaction:
        token_threshold: 96000
        retention: 20
      resumable: true

    tracing:
      mode: metadata
      max_content_bytes: 8192

    skills:
      project_root_enabled: true
      additional_roots: []

    learning:
      enabled: true
      minimum_support: 3
      trial_percent: 20

    reviewer:
      enabled: false
      agent: final_diff_reviewer
      max_chars: 60000

persistence:
  session_backend: sqlite
  artifact_backend: file
  memory_backend: in_memory

server:
  host: 127.0.0.1
  port: 8765
  websocket_path: /v1/agent
  protocol: ag_ui_websocket_v1
  max_connections: 32
  inbound_queue_size: 64
  outbound_queue_size: 256
  heartbeat_seconds: 20
