schema_version: 1

app:
  name: pi_inspired_adk_coding_agent

harness:
  implementation: pi_coding_v1
  api_version: 1
  required_capabilities:
    - streaming
    - steering
    - tool_events
    - state_snapshots
    - artifacts
  config:
    models:
      coding:
        provider: google_adk
        name: gemini-3.7-flash
        retry:
          attempts: 3
          exponential_base: 2
          initial_delay_seconds: 1
          retry_statuses: [429, 500, 502, 503, 504]
    agents:
      coding_worker:
        kind: llm
        model: coding
        prompt:
          source: builtin
          name: coding_worker_v1
        tools: [read, bash, edit, write]
        output_schema: agent_step
        mode: multi_turn
    workflow:
      max_iterations: 40

    tools:
      visible: [read, bash, edit, write]
      read_default_lines: 400
      bash_default_timeout_seconds: 120
      bash_max_timeout_seconds: 600
      output:
        max_bytes: 16000
      search:
        backend: auto
        default_page_size: 20
        max_page_size: 50

    context:
      compact_at_tokens: 80000
      work_packet_tokens: 20000
      max_task_input_tokens: 200000
      recent_event_limit: 12
      repository_map_tokens: 1200
      skill_context_bytes: 24000
      max_selected_skills: 3
      ledger_tokens: 2000
      manifest_tokens: 800
      compaction_tokens: 3000
      recent_event_tokens: 3500
      conversation_tokens: 2000
      steering_tokens: 1000

    safety:
      allow_dependency_install: false
      allow_network: false
      allow_git_history_mutation: false
      allow_unknown_commands: false
      destructive_commands: deny
      publishing_commands: approval_required
      redact_environment_names: []

    sandbox:
      kind: local
      memory_bytes: 4294967296
      max_processes: 256
      max_file_bytes: 1073741824

    steering:
      enabled: true
      lease_seconds: 900
      batch_limit: 4
      max_message_bytes: 4096
      safe_points: [before_model, before_tool, work_batch_boundary]

    adk:
      context_cache:
        min_tokens: 4096
        ttl_seconds: 1800
        cache_intervals: 10
      event_compaction:
        token_threshold: 96000
        retention: 20
      resumable: true

    tracing:
      mode: metadata
      max_content_bytes: 8192

    skills:
      project_root_enabled: true
      additional_roots: []

persistence:
  session_backend: sqlite
  artifact_backend: file
  memory_backend: in_memory

server:
  host: 127.0.0.1
  port: 8765
  websocket_path: /v1/agent
  protocol: ag_ui_websocket_v1
  max_connections: 32
  outbound_queue_size: 256
  first_event_timeout_seconds: 120
  idle_timeout_seconds: 180
  total_timeout_seconds: 1800
  first_event_retries: 1
  close_timeout_seconds: 15
