name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: clients/terminal/package-lock.json
      - name: Install locked TUI dependencies
        run: npm ci --ignore-scripts
      - name: Build and test TUI
        run: npm test

  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Compile Python sources
        run: uv run python -m compileall -q app harness tests
      - name: Run deterministic unit tests
        run: uv run pytest -q tests/unit
      - name: Lint
        run: uv run ruff check app harness tests
      - name: Type check
        run: uv run pyright app harness
